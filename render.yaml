services:
  - type: web
    name: meetingpilot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_PATH
        value: /var/data/meetingpilot.db
    disk:
      name: meetingpilot-data
      mountPath: /var/data
      sizeGB: 1
