services:
  - type: web
    name: meetingpilot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/meetingpilot.db
      - key: SUPABASE_URL
        value: https://magysstkgdiyqvmfbjjc.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ENABLE_DEMO_SEED
        value: false
    disk:
      name: meetingpilot-data
      mountPath: /var/data
      sizeGB: 1
