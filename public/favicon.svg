<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="wing-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="wing-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="wing-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="trail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Pilot Momentum Trail (Checkmark + Jet Stream) -->
  <path d="M12 43 L21 52 L36 37" fill="none" stroke="url(#trail)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <circle cx="12" cy="43" r="2" fill="#38bdf8"/>

  <!-- Supersonic Pilot Jet -->
  <g filter="url(#glow)">
    <!-- Main Left Wing / Fuselage -->
    <path d="M51 13 L17 32 L34 35 Z" fill="url(#wing-top)"/>
    <!-- Right Fold / Keel -->
    <path d="M51 13 L34 35 L28 47 Z" fill="url(#wing-side)"/>
    <!-- Underwing Fin Shadow -->
    <path d="M34 35 L28 47 L38 41 Z" fill="url(#wing-bottom)"/>
    <!-- Cockpit Core Line -->
    <path d="M51 13 L34 35" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
